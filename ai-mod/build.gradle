plugins { id 'fabric-loom' version '1.8.13' }
version = '0.3.0'
group = 'cn.suyuncraft'
base { archivesName = 'suyuncraft-ai' }
repositories { mavenCentral() }
// Optional verified local build cache for machines whose Mojang CDN stalls on these artifacts.
// Not shipped; clean machines use the standard repositories above.
if (file('.tools/maven').exists()) {
    repositories {
        exclusiveContent {
            forRepository { maven { url = uri('.tools/maven') } }
            filter { includeModule('io.netty', 'netty-buffer'); includeModule('io.netty', 'netty-common'); includeModule('it.unimi.dsi', 'fastutil'); includeModule('org.jetbrains', 'annotations') }
        }
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    // Compile only the modules used by this client, rather than remapping the entire API.
    modImplementation 'net.fabricmc.fabric-api:fabric-api-base:0.4.42+6573ed8c19'
    modImplementation 'net.fabricmc.fabric-api:fabric-command-api-v2:2.2.28+6ced4dd919'
    modImplementation 'net.fabricmc.fabric-api:fabric-lifecycle-events-v1:2.3.12+6c1df36019'
}
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.register('compileBlueprintChecks', JavaCompile) {
    dependsOn classes
    source = fileTree('src/verification/java')
    classpath = files(sourceSets.main.output)
    destinationDirectory = layout.buildDirectory.dir('verification')
}
tasks.register('blueprintTest', JavaExec) {
    dependsOn compileBlueprintChecks
    classpath = files(layout.buildDirectory.dir('verification'), sourceSets.main.output)
    mainClass = 'cn.suyuncraft.ai.BlueprintTests'
}
tasks.named('check') { dependsOn blueprintTest }
tasks.register('dialogueTest', JavaExec) {
    dependsOn compileBlueprintChecks
    classpath = files(layout.buildDirectory.dir('verification'), sourceSets.main.output)
    mainClass = 'cn.suyuncraft.ai.DialogueTests'
}
tasks.named('check') { dependsOn dialogueTest }
// Remapping needs Java class hierarchies, not platform-native runtime jars for every Windows architecture.
tasks.named('remapJar') { classpath.setFrom(configurations.compileClasspath) }
if (!gradle.startParameter.taskNames.any { it.toLowerCase().contains('run') }) {
    configurations.configureEach { configuration ->
        if (configuration.name.startsWith('minecraft')) {
            configuration.withDependencies { deps ->
                deps.removeAll { dep -> dep.hasProperty('artifacts') && dep.artifacts.any { it.classifier?.startsWith('natives-') } }
            }
        }
    }
}
